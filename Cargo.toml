[package]
name = "bonito"
version = "0.1.0"
edition = "2024"
description = "A terminal UI for the kuna decompiler"
repository = "https://github.com/atirelli3/bonito"
publish = false

[dependencies]
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(unix)".dependencies]
signal-hook = "0.3.18"
